<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>직장생활 N분의 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* 버전 선택: v1·v2 두 장의 카드 */
:root{--paper:#ECEEEA;--surface:#F8F9F6;--ink:#1C2127;--muted:#5D6670;--line:#CDD2CC;--accent:#1F4E79;color-scheme:light;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#14181C;--surface:#1C2126;--ink:#E3E6E2;--muted:#9AA3AB;--line:#2F363D;--accent:#86AFD9;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#14181C;--surface:#1C2126;--ink:#E3E6E2;--muted:#9AA3AB;--line:#2F363D;--accent:#86AFD9;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);line-height:1.6}
main{max-width:760px;margin:0 auto;padding:48px 20px}
h1{font-size:34px;margin:0 0 8px;letter-spacing:-0.02em;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px}
a.card:hover,a.card:focus-visible{border-color:var(--accent);outline:none}
.ver{font-family:var(--font-mono);font-size:12px;color:var(--accent)}
.card h2{margin:4px 0 6px;font-size:20px}
.card p{margin:0;color:var(--muted);font-size:14px}
footer{margin-top:32px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>직장생활 N분의 1</h1>
  <p class="lead">어떤 인생을 살아볼까. 버전을 골라 시작해.</p>
  <div class="grid">
    <a class="card" href="v1/index.html">
      <div class="ver">v1 · 공공기관 편</div>
      <h2>입사부터 정년까지</h2>
      <p>같은 날 입사한 동기 다섯 명 중 한 명으로 공공기관에서 30년을 산다.</p>
    </a>
    <a class="card" href="v2/index.html">
      <div class="ver">v2 · 회사생활 성공기 (개발 중)</div>
      <h2>0살부터 첫 직장까지</h2>
      <p>태어난 집, 학교, 군대, 친구를 거쳐 관심 분야를 쌓고 첫 직장에 들어간다.</p>
    </a>
  </div>
  <footer>비공식 팬메이드 시뮬레이션입니다. 실제 기관·인물과 관계없습니다. '80억 분의 1'에서 영감을 받았습니다.</footer>
</main>
</body>
</html>
